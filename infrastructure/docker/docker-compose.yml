# Visual Social Graph - local development services
#
# Usage (requires Docker Desktop running):
#   docker compose -f infrastructure/docker/docker-compose.yml up -d
#
# Then point apps/api/.env at:
#   DATABASE_URL="postgresql://vsg:vsg_dev_password@localhost:5432/vsg?schema=public"
#   REDIS_URL=redis://localhost:6379
#
# Switching the API from SQLite to PostgreSQL also requires:
#   1. apps/api/prisma/schema.prisma -> provider = "postgresql"
#   2. Restore native Json types on Graph/Insight/Export models
#      (currently String because SQLite lacks Json)
#   3. Remove manual JSON.parse/JSON.stringify in graph/insight routes
#   4. pnpm --filter @vsg/api db:migrate

services:
  postgres:
    image: postgres:16-alpine
    container_name: vsg-postgres
    environment:
      POSTGRES_USER: vsg
      POSTGRES_PASSWORD: vsg_dev_password
      POSTGRES_DB: vsg
    ports:
      - '5432:5432'
    volumes:
      - vsg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vsg -d vsg']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vsg-redis
    ports:
      - '6379:6379'
    volumes:
      - vsg_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vsg_pgdata:
  vsg_redisdata:
